name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: MoonBit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Toolchain information
        run: moon version --all

      - name: Check formatting and public interface
        run: |
          moon fmt --check
          moon info
          moon check --target js

      - name: Run MoonBit tests
        run: moon test --target js

      - name: Build release web application
        run: npm run build

      - name: Run CLI integration tests
        run: npm run test:cli

      - name: Run browser smoke test
        run: npm run test:web

      - name: Validate package file list
        run: moon package --list
